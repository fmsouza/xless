name: release
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      first_version:
        description: Version of the first release (x.y.z); used only when no v* tag exists yet
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether anything is releasable. A scheduled run with no v* tag yields an empty version.
  # Only main releases: a dispatch from another branch skips every job.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # scripts/ci-passed.sh lists main's pr workflow runs
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
      prev: ${{ steps.next.outputs.prev }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Next version
        id: next
        env:
          FIRST_VERSION: ${{ inputs.first_version }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prev=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          # The base of the next version must be a tag this workflow made (it has a release), never one pushed by hand.
          if [ -n "$prev" ] && ! why=$(scripts/release-tag-check.sh "$prev" 2>&1); then
            echo "::error::not releasing: $why"
            exit 1
          fi
          version=$(scripts/next-version.sh ${FIRST_VERSION:+--first "$FIRST_VERSION"})
          SHA=$(git rev-parse HEAD)
          # Only a commit whose main CI (the pr workflow's push run) succeeded is released: a night without that skips,
          # a manual dispatch fails loudly.
          if [ -n "$version" ] && ! why=$(scripts/ci-passed.sh "$SHA" 2>&1); then
            echo "::warning::not releasing v$version from $SHA: $why"
            if [ "$EVENT" != schedule ]; then exit 1; fi
            version=""
          fi
          { echo "version=$version"; echo "sha=$SHA"; echo "prev=$prev"; } >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then echo "Releasing v$version from $(git rev-parse HEAD)"; else echo "No releasable change."; fi

  build:
    name: build (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: swift:6.4.0-jammy@sha256:11bb836ebbc05dbe59b28ffa6cb6ca6b452375d7a65b322c5b6c83f44d52f8c0   # versions.env SWIFT_IMAGE (Tests/shell/swift-image.test.sh)
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: x86_64, runner: ubuntu-24.04, triple: x86_64-swift-linux-musl }
          - { name: arm64, runner: ubuntu-24.04-arm, triple: aarch64-swift-linux-musl }
    steps:
      - name: Install tools
        # The runners' resolver can fail on *.ubuntu.com while public resolvers answer (seen 2026-11-11, every job
        # failing here); only then does this container use public resolvers instead.
        run: |
          getent hosts archive.ubuntu.com ports.ubuntu.com security.ubuntu.com >/dev/null \
            || printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions edns0\n' > /etc/resolv.conf
          apt-get update -qq && apt-get install -y -qq git curl ca-certificates >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Build and package
        uses: ./.github/actions/build-package
        with:
          arch: ${{ matrix.name }}
          triple: ${{ matrix.triple }}
          version: ${{ needs.plan.outputs.version }}
          out-dir: dist
          stamp: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-${{ matrix.name }}
          path: dist/xless-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Installs the stamped tarballs from a file:// copy of the release, on each architecture, exactly as a user would
  # (scripts/verify-release.sh), before anything is published. On the bare runner: the static binary needs no Swift.
  verify:
    name: verify (${{ matrix.name }})
    needs: [plan, build]
    if: needs.plan.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: x86_64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: The release's assets
        run: scripts/release-assets.sh "$VERSION" dist
      - name: Install the release and check its version
        run: scripts/verify-release.sh "$VERSION" dist

  # Runs on the runner itself (gh is not in the swift container). The only job with write access: the release, and a
  # build provenance attestation for each asset (OIDC token for Sigstore, attestations stored on GitHub).
  publish:
    needs: [plan, build, verify]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      PREV: ${{ needs.plan.outputs.prev }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      # The same script the verify job ran, on the same tarballs.
      - name: Checksums and installer
        run: scripts/release-assets.sh "$VERSION" dist
      # Signed SLSA build provenance for each asset: `gh attestation verify <file> -R fmsouza/xless` proves that this
      # workflow, at this commit, made it (docs/maintainers.md#releases).
      - name: Attest the assets' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/xless-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
      - name: Release notes
        run: |
          scripts/release-notes.sh "$PREV" "$SHA" > notes.md
          cat notes.md
      # --target makes gh create the tag at the planned commit together with the release, so a failure leaves no orphan tag.
      - name: Create the tag and the release
        run: |
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file notes.md \
            dist/xless-*.tar.gz dist/SHA256SUMS dist/install.sh
