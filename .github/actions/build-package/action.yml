name: Build and package xless
description: Builds xless for one system and architecture (a static binary on Linux) and packs the release tarball, or zip (used by pr.yml and release.yml).
inputs:
  os:
    description: linux, macos (on a macOS runner; either architecture) or windows (on a Windows runner with the toolchain of scripts/windows-toolchain.ps1)
    required: false
    default: linux
  arch:
    description: x86_64 or arm64
    required: true
  triple:
    description: Swift SDK triple, e.g. x86_64-swift-linux-musl (linux only)
    required: false
    default: ''
  version:
    description: Version for the package's name (0.0.0-dev for the PR check, x.y.z for a release)
    required: true
  out-dir:
    description: Directory that receives the package and its SHA256SUMS line
    required: true
  stamp:
    description: "'true' stamps the version into the tree before building (releases only; needs x.y.z)"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Stamp the version
      if: inputs.stamp == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: scripts/stamp-version.sh "$VERSION"
    - name: Build the static binary
      if: inputs.os == 'linux'
      shell: bash
      env:
        TRIPLE: ${{ inputs.triple }}
      run: |
        # GitHub answers 401 to some git versions over HTTP/2.
        git config --global http.version HTTP/1.1
        . ./versions.env
        swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_SHA256"
        swift build -c release --product xless --swift-sdk "$TRIPLE"
        echo "XLESS_BIN=$(swift build -c release --product xless --swift-sdk "$TRIPLE" --show-bin-path)/xless" >> "$GITHUB_ENV"
    # With the runner's Xcode, against its SDK: the binary links to the system's libraries only, and the package holds nothing
    # of either (scripts/check-macos-binary.sh and check-package.sh, which package-release.sh runs). Nothing is cached. Without
    # the runtime-compatibility-version, dependencies that are for older systems bring in libswiftCompatibility56.a.
    - name: Build the macOS binary
      if: inputs.os == 'macos'
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        git config --global http.version HTTP/1.1
        xcodebuild -version
        swift --version
        # The linker's map says what was linked in (scripts/check-link-map.sh, which package-release.sh runs).
        map="$RUNNER_TEMP/xless-$ARCH.map"
        build=(swift build -c release --product xless --arch "$ARCH" -Xswiftc -runtime-compatibility-version -Xswiftc none -Xlinker -map -Xlinker "$map")
        "${build[@]}"
        bin="$("${build[@]}" --show-bin-path)/xless"
        # Package.swift has the linker sign it, for x86_64 too: what is built from source works without a step more.
        codesign --verify --strict --verbose "$bin"
        echo "XLESS_BIN=$bin" >> "$GITHUB_ENV"
        echo "XLESS_LINK_MAP=$map" >> "$GITHUB_ENV"
    # With the toolchain's runtime, whose DLLs package-release.sh takes from XLESS_RUNTIME. The flag is the linker's: xless.exe's own
    # libraries come from its own directory or System32 (LOAD_LIBRARY_SEARCH_APPLICATION_DIR | LOAD_LIBRARY_SEARCH_SYSTEM32), so this
    # xless.exe starts only as it is packaged. The symbol is of vcruntime140_1.dll, which xless.exe is to need itself (windows-package.py).
    # Nothing is cached.
    - name: Build the Windows program
      if: inputs.os == 'windows'
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        swift --version
        $build = 'build', '--build-system', 'native', '-c', 'release', '--product', 'xless', '-debug-info-format', 'none', '-Xlinker', '/DEPENDENTLOADFLAG:0xA00', '-Xlinker', '/INCLUDE:__CxxFrameHandler4'
        swift @build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $bin = swift @build --show-bin-path
        $runtime = @($env:PATH -split ';' | Where-Object { $_ -and (Test-Path -LiteralPath (Join-Path $_ 'swiftCore.dll')) } | ForEach-Object { $_.TrimEnd('\') } | Select-Object -Unique)
        if ($runtime.Count -ne 1) { throw "one Swift runtime is expected on PATH: $runtime" }
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "XLESS_BIN=$(Join-Path $bin 'xless.exe')", "XLESS_RUNTIME=$($runtime[0])"
    - name: The binary reports the stamped version
      if: inputs.stamp == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OS: ${{ inputs.os }}
        ARCH: ${{ inputs.arch }}
      run: |
        # The x86_64 binary of an arm64 Mac is first run on an Intel one, by the job that installs it, and a Windows one beside its DLLs.
        if [ "$OS" = windows ]; then exit 0; fi
        if [ "$OS" = macos ] && [ "$(uname -m)" != "$ARCH" ]; then exit 0; fi
        got=$("$XLESS_BIN" --version)
        [ "$got" = "$VERSION" ] || { echo "::error::xless --version printed '$got', expected '$VERSION'"; exit 1; }
    - name: Package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OS: ${{ inputs.os }}
        ARCH: ${{ inputs.arch }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        mkdir -p "$OUT_DIR"
        scripts/package-release.sh --os "$OS" "$VERSION" "$ARCH" "$XLESS_BIN" "$OUT_DIR"
        ls -l "$OUT_DIR"
