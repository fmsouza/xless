name: Build and package xless
description: Builds xless for one system and architecture (a static binary on Linux) and packs the release tarball (used by pr.yml and release.yml).
inputs:
  os:
    description: linux, or macos (on a macOS runner; either architecture)
    required: false
    default: linux
  arch:
    description: x86_64 or arm64
    required: true
  triple:
    description: Swift SDK triple, e.g. x86_64-swift-linux-musl (linux only)
    required: false
    default: ''
  version:
    description: Version for the tarball name (0.0.0-dev for the PR check, x.y.z for a release)
    required: true
  out-dir:
    description: Directory that receives the tarball and its SHA256SUMS line
    required: true
  stamp:
    description: "'true' stamps the version into the tree before building (releases only; needs x.y.z)"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Stamp the version
      if: inputs.stamp == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: scripts/stamp-version.sh "$VERSION"
    - name: Build the static binary
      if: inputs.os == 'linux'
      shell: bash
      env:
        TRIPLE: ${{ inputs.triple }}
      run: |
        # GitHub answers 401 to some git versions over HTTP/2.
        git config --global http.version HTTP/1.1
        . ./versions.env
        swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_SHA256"
        swift build -c release --product xless --swift-sdk "$TRIPLE"
        echo "XLESS_BIN=$(swift build -c release --product xless --swift-sdk "$TRIPLE" --show-bin-path)/xless" >> "$GITHUB_ENV"
    # With the runner's Xcode, against its SDK: the binary links to the system's libraries only, and the package holds nothing
    # of either (scripts/check-macos-binary.sh and check-package.sh, which package-release.sh runs). Nothing is cached.
    - name: Build the macOS binary
      if: inputs.os == 'macos'
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        git config --global http.version HTTP/1.1
        xcodebuild -version
        swift --version
        swift build -c release --product xless --arch "$ARCH"
        echo "XLESS_BIN=$(swift build -c release --product xless --arch "$ARCH" --show-bin-path)/xless" >> "$GITHUB_ENV"
    - name: The binary reports the stamped version
      if: inputs.stamp == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OS: ${{ inputs.os }}
        ARCH: ${{ inputs.arch }}
      run: |
        # The x86_64 binary of an arm64 Mac is first run on an Intel one, by the job that installs it.
        if [ "$OS" = macos ] && [ "$(uname -m)" != "$ARCH" ]; then exit 0; fi
        got=$("$XLESS_BIN" --version)
        [ "$got" = "$VERSION" ] || { echo "::error::xless --version printed '$got', expected '$VERSION'"; exit 1; }
    - name: Package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OS: ${{ inputs.os }}
        ARCH: ${{ inputs.arch }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        mkdir -p "$OUT_DIR"
        scripts/package-release.sh --os "$OS" "$VERSION" "$ARCH" "$XLESS_BIN" "$OUT_DIR"
        ls -l "$OUT_DIR"
