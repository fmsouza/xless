# Example only: this workflow is not run by this repository (it lives in docs/examples/, not .github/workflows/).
# It needs a Linux runner of your own with Docker, on which `xless setup --docker --sdk <dir>` made the xless image and the
# Xcode pack's volume once. The image holds nothing of Apple's; the pack holds Apple's SDK, so it stays on the runner (no
# registry, no cache, no artifact). Never let pull requests of others run on such a runner.
# Each step is a container of the image, with the pack read-only: the build in one without any secret, the signing in another.
# This is one job on one runner: it keeps a build's mistake away from the secrets, not code that means harm, and its git diff
# is a check for accidents. For code you do not trust, use two jobs (docs/ci.md#in-two-jobs, docs/security.md#a-build-that-means-harm).
# The read-only .git and the check's --ignore-submodules=all are hardening; docs/ci.md#in-the-image says what each does not close.
# Copy it to your app repository's .github/workflows/ and adapt IMAGE, PACK and APP. What it does not protect: docs/ci.md.
name: example-ios-image
on: workflow_dispatch
permissions:
  contents: read
env:
  XLESS_NO_INPUT: 1
  IMAGE: xless:1.4.0-amd64                  # the image of the xless on the runner: docker image ls xless
  PACK: xless-xcode-26.2-17C52-amd64        # the pack of the Xcode the project pins: docker volume ls --filter label=org.xless.pack
  APP: samples/HelloShip                    # the app's directory in the repository (. for its top)
jobs:
  ship:
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Build numbers must increase across every machine that uploads this version (ITMS-90062), so use
      # the same monotonic scheme everywhere: minutes since 1970. (github.run_number restarts at 1.)
      - name: The build number
        id: number
        run: echo "minutes=$(( $(date +%s) / 60 ))" >> "$GITHUB_OUTPUT"
      - name: Build HelloShip (no secret)
        env:
          XLESS_BUILD_NUMBER: ${{ steps.number.outputs.minutes }}
        run: |
          docker run --rm --pull=never --user "$(id -u):$(id -g)" -e HOME=/tmp -e XLESS_NO_INPUT -e XLESS_BUILD_NUMBER \
            --mount "type=volume,src=$PACK,dst=/xcodes,readonly" \
            -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/.git:/work/.git:ro" -w "/work/$APP" "$IMAGE" \
            xless run . --to finalize
      # A check for accidents. At the repository's top, whose .git the build could not write, and into no submodule's path:
      # the build may have made a repository of its own in any directory.
      - name: What the build changed in the repository (no secret)
        run: git -C "$GITHUB_WORKSPACE" --no-optional-locks diff --exit-code --ignore-submodules=all
      - name: Sign, and upload to TestFlight
        env:
          XLESS_BUILD_NUMBER: ${{ steps.number.outputs.minutes }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          XLESS_DIST_KEY: ${{ secrets.XLESS_DIST_KEY }}
        run: |
          docker run --rm --pull=never --user "$(id -u):$(id -g)" -e HOME=/tmp -e XLESS_NO_INPUT -e XLESS_BUILD_NUMBER \
            -e ASC_KEY_ID -e ASC_ISSUER_ID -e ASC_KEY_P8 -e XLESS_DIST_KEY \
            --mount "type=volume,src=$PACK,dst=/xcodes,readonly" \
            -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/.git:/work/.git:ro" -w "/work/$APP" "$IMAGE" \
            xless run . --from sign
